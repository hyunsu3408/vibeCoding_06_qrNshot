<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 단축 서비스 - 빠른 링크 줄이기</title>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Interactive Dynamic Gradient Background -->
  <div class="interactive-bg" id="interactiveBg" aria-hidden="true">
    <div class="gradient-layer-base"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="cursor-glow" id="cursorGlow"></div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo-wrapper" id="logoBtn" role="button" tabindex="0" title="처음으로 이동">
      <img src="img/logo.png" alt="서비스 로고" class="logo-img" id="appLogo">
    </div>

    <!-- Service Switch Navigation (QR코드 & URL단축) -->
    <nav class="nav-switch-group" aria-label="서비스 전환">
      <a href="../url2qr/index.html" class="nav-btn" title="QR코드 생성기로 이동">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
          <circle cx="17.5" cy="17.5" r="2.5"></circle>
        </svg>
        <span>QR코드</span>
      </a>
      <a href="index.html" class="nav-btn active" title="URL 단축 서비스 (현재)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>URL단축</span>
      </a>
    </nav>

    <div class="header-right">
      <button type="button" class="btn-text-action" id="btnReset" title="새로운 URL 단축">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>초기화</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="app-main">
    <div class="content-wrapper">

      <!-- Hero Header -->
      <section class="hero-section">
        <div class="badge-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
          <span>OpenAPI 연동 초고속 단축 서비스</span>
        </div>
        <h1 class="hero-title">긴 웹 주소를 간편하게 줄여보세요</h1>
        <p class="hero-desc">복잡하고 긴 URL을 짧고 깔끔한 링크로 변환하여 쉽게 공유하고 관리하세요.</p>
      </section>

      <!-- URL Shortening Form Card (3-1, 3-2, 3-3) -->
      <section class="shorten-card">
        <form class="url-form" id="shortenForm" onsubmit="return false;">
          <div class="input-card" id="inputCard">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </div>
            
            <!-- URL 입력 필드 (3-1) -->
            <input 
              type="text" 
              id="urlInput" 
              class="url-field" 
              placeholder="단축할 긴 URL을 입력하세요 (예: https://example.com/very/long/page...)" 
              autocomplete="off" 
              autofocus 
              spellcheck="false"
            >

            <!-- 입력 지우기 버튼 -->
            <button type="button" class="btn-clear-input" id="btnClearInput" title="입력 지우기" aria-label="입력 지우기" style="display: none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>

            <!-- 단축하기 버튼 (3-1, 3-2: 빈 값일 때 disabled) -->
            <button type="submit" class="btn-submit" id="btnShorten" disabled title="단축할 URL을 입력하면 활성화됩니다">
              <span class="btn-text">단축하기</span>
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
              <div class="btn-spinner" id="btnSpinner" aria-hidden="true"></div>
            </button>
          </div>

          <!-- 상태 및 에러 메시지 안내 영역 -->
          <div class="input-message" id="inputMessage"></div>
        </form>
      </section>

      <!-- Shortened Result Section (3-1, 3-3, 3-4) -->
      <section class="result-section" id="resultSection" style="display: none;" aria-label="단축 결과 영역">
        <div class="result-card">
          <div class="result-header">
            <div class="result-status-badge">
              <span class="badge-dot"></span>
              <span>단축 성공!</span>
            </div>
            <div class="savings-badge" id="savingsBadge">
              <span id="savingsText">길이 0% 단축</span>
            </div>
          </div>

          <!-- Original Long URL Preview -->
          <div class="original-url-row" title="원본 URL">
            <span class="label">원본 링크:</span>
            <span class="url-text" id="originalUrlDisplay"></span>
          </div>

          <!-- Readonly Output Box & Copy Button (3-1, 3-4) -->
          <div class="output-group">
            <div class="output-box-wrapper">
              <svg class="output-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
              <!-- 읽기 전용 출력 상자 (3-1) -->
              <input 
                type="text" 
                id="resultBox" 
                class="result-field" 
                readonly 
                placeholder="단축된 URL이 여기에 표시됩니다"
                title="클릭하여 전체 선택"
              >
            </div>

            <!-- 복사 버튼 (3-4) -->
            <button type="button" class="btn-copy" id="btnCopy" title="단축된 링크를 클립보드에 복사">
              <svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span class="copy-text">복사</span>
            </button>
          </div>

          <!-- Quick Action Buttons -->
          <div class="result-actions">
            <a href="#" target="_blank" rel="noopener noreferrer" class="btn-secondary" id="btnOpenLink">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
              <span>링크 바로 열기</span>
            </a>
            
            <a href="#" class="btn-secondary btn-qr-action" id="btnMakeQR">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
                <circle cx="17.5" cy="17.5" r="2.5"></circle>
              </svg>
              <span>이 단축 URL로 QR코드 만들기</span>
            </a>
          </div>
        </div>
      </section>

      <!-- History Section -->
      <section class="history-section" id="historySection" style="display: none;">
        <div class="history-header">
          <h2 class="history-title">최근 단축 내역</h2>
          <button type="button" class="btn-clear-history" id="btnClearHistory">기록 지우기</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>

    </div>
  </main>

  <!-- Toast Notification -->
  <div class="toast-container" id="toastContainer">
    <div class="toast-pill" id="toastPill">
      <svg class="toast-check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span class="toast-text" id="toastText">복사하였습니다.</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
